name: Temporary native motion profile

on:
  push:
    branches: [codex/selector-ci-profile]

permissions:
  contents: read

jobs:
  selector-cpu-profile:
    name: Original motion in iOS shard 1
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/select-xcode
      - name: Require unchanged product and test sources
        run: |
          git cat-file -e '4324c953db64b4596988ab4d3dd3d21f593c5734^{commit}'
          git diff --exit-code 4324c953db64b4596988ab4d3dd3d21f593c5734 HEAD -- Apps Packages project.yml
      - name: Profile original motion and thread scheduling during the complete shard sequence
        run: make profile-ios-motion IOS_PROFILE_FULL_SHARD=YES
      - name: Upload bounded CPU trace and diagnostic provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-motion-ci-profile
          path: build/native-motion-profile
          retention-days: 7
          if-no-files-found: error
