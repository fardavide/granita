name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold:
        description: Skip build and dependency caches for the verification run
        type: boolean
        default: false
      compare_legacy:
        description: Run the retained measurement on the same revision and toolchain
        type: boolean
        default: false

# A newer push to the same ref cancels an in-flight run. macOS runner minutes are billed at 10x,
# so this is the difference between a rebased branch costing one run and costing four.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One concern per job, on its own runner. Each job name below is a required status check in
# .github/rulesets/protect-main.json — renaming one here without renaming it there leaves every
# pull request pending forever, with no error to explain it.
#
# Every job runs on `xcode-27`, GitHub's image for Xcode 27 and its iOS 27 simulators, because that is
# the Xcode Granita is developed against. `macos-26` carries only Xcode 26.x. The two caches below that
# hold compiled objects carry `xcode27` in their keys, so no restore can hand this toolchain a build
# made by the previous one.
jobs:

  # The deterministic TDD suite: the package's own tests, run on the host with no simulator. This
  # is the job that will carry the diff parser, the git layer and every view model, and it is the
  # one that must stay fast enough to be run on every save locally.
  unit-tests:
    name: Unit tests (Granita)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Cache SwiftPM source packages
        if: ${{ !inputs.cold }}
        uses: actions/cache@v4
        with:
          path: build/derived/package
          key: spm-coverage-xcode27-${{ runner.os }}-${{ hashFiles('Packages/Granita/Package.resolved') }}
          restore-keys: spm-coverage-xcode27-${{ runner.os }}-
      # The git layer's tests drive the real binary against real repositories, which are gitignored
      # and therefore absent from a checkout. Regenerating them here also means every run asserts
      # the git behaviours the generator checks, against whatever git this image ships.
      - name: Build the git fixture repositories
        run: make fixtures
      - name: Run package tests
        run: make coverage-unit
      - name: Upload unit coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-input-unit
          path: build/coverage-inputs/unit
          retention-days: 7
          if-no-files-found: error
      - name: Remove counters before saving compiled outputs
        if: always()
        run: find build/derived/package -type d -name codecov -prune -exec rm -rf {} +

  # Compile-check each app on its own platform. Separate jobs rather than a matrix step, so a
  # macOS-only regression cannot hide behind an iOS failure and the ruleset gets one check per
  # platform. Unsigned: a compile check needs no signed binary and the runner holds no identity.
  build:
    name: Build app (${{ matrix.app.name }})
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: macOS, scheme: GranitaMac,    destination: 'generic/platform=macOS' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Cache SwiftPM source packages
        if: ${{ !inputs.cold }}
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Packages/Granita/Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Granita.xcodeproj -scheme ${{ matrix.app.scheme }} -clonedSourcePackagesDirPath SourcePackages
      - name: Build
        if: matrix.app.name == 'macOS'
        run: |
          xcodebuild build \
            -project Granita.xcodeproj \
            -scheme ${{ matrix.app.scheme }} \
            -destination '${{ matrix.app.destination }}' \
            -clonedSourcePackagesDirPath SourcePackages \
            -quiet \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
  build-ios:
    name: Build app (iOS)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Cache SwiftPM source packages
        if: ${{ !inputs.cold }}
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('Packages/Granita/Package.resolved') }}
          restore-keys: xcode-spm-${{ runner.os }}-
      - name: Build instrumented iOS test products
        run: make coverage-ios-build coverage-ios-pack
      - name: Upload reusable iOS test products
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-products
          path: build/ios-test-products.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # Three things in this repository are generated and committed: Granita.xcodeproj (from
  # project.yml), the golden diff fixtures (from the real git binary), and the app icon sets. Each
  # is committed for a reason — Xcode Cloud needs a project that is continuously present, the
  # parser suite must run without git, and an icon is a hard App Store Connect reject. Committed
  # generated files go stale silently, so this job regenerates all three and fails if anything moved.
  #
  # It doubles as the guard on git's own behaviour: make-fixture-repo.sh asserts the traps the git
  # layer relies on — the two opposite -z rename layouts, the `diff --no-index` exit code, unborn
  # HEAD, a conflicted path diffing as a normal unified diff rather than diff --cc. If a future git
  # release changes one, this job goes red with a readable diff instead of the parser quietly
  # reading the wrong field.
  generated:
    name: Generated files
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Install XcodeGen
        run: brew install --quiet xcodegen
      # Both tools shape the committed output, so a red run below is only readable if you can see
      # which versions produced it. A project.pbxproj diff usually means XcodeGen moved; a .diff
      # fixture diff usually means git did.
      - name: Report the tool versions that produced the comparison
        run: |
          git --version
          xcodegen --version
      - name: Regenerate and compare
        run: make verify-generated

      # Xcode resolves the project and the local package as ONE graph and writes the union into the
      # package's Package.resolved; `swift build` and `swift test` rewrite the same file with the
      # package's own dependencies only. Whoever ran last wins, and Xcode Cloud — which disables
      # automatic resolution — refuses the stripped version outright.
      #
      # That failure lands after the merge, as an email about a broken archive, with no red check to
      # have caught it. This is the red check. `make resolve` is the fix.
      - name: Assert Package.resolved covers the Xcode graph
        run: |
          if ! grep -q 'swift-snapshot-testing' Packages/Granita/Package.resolved; then
            echo "::error::Package.resolved is missing swift-snapshot-testing, so the Xcode Cloud archive cannot resolve. Run 'make resolve' and commit the result."
            exit 1
          fi
          echo "Package.resolved covers the Xcode graph."

  coverage-legacy-comparison:
    name: Legacy coverage comparison (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.compare_legacy
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Prepare real git fixtures
        run: make fixtures
      - name: Measure the retained path
        run: make coverage-legacy
      - name: Upload the legacy report for count and file comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-legacy-exports
          path: build/coverage
          retention-days: 7
          if-no-files-found: error

  # Reports *and* gates. The rule is Oltre's: a plain ratchet with no floor and no slack — every
  # percentage in the per-kind table must hold at or above the last green `main` run. A fixed
  # threshold either sits so low it never fires or so high it blocks unrelated work; a ratchet asks
  # the only question worth asking of a pull request, which is whether it made things worse.
  #
  # Required suites produce counters and matching mappings once. This job verifies their verdicts
  # and provenance, merges the raw profiles, then applies the unchanged category and total ratchets.
  coverage:
    name: Coverage
    needs: [unit-tests, snapshot-tests, snapshot-tests-mac]
    if: always()
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require every suite verdict
        env:
          UNIT: ${{ needs.unit-tests.result }}
          IOS: ${{ needs.snapshot-tests.result }}
          MAC: ${{ needs.snapshot-tests-mac.result }}
        run: test "$UNIT" = success && test "$IOS" = success && test "$MAC" = success
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode

      # The delta's other half. Only `main` writes a baseline, so the most recent cache matching the
      # prefix is always the last green `main` run — and a pull request branch can read the default
      # branch's caches, which is what makes this work with no token and no external service.
      # Restored before the measurement, and outside `build/`, which the measurement wipes.
      #
      # v2 because the summary is now keyed by test kind rather than by module. A v1 baseline shares
      # no value with a v2 run, so reading one would report the gate as skipped on every branch until
      # `main` happened to write a new one — a silently ungated week.
      - name: Restore the main coverage baseline
        uses: actions/cache/restore@v4
        with:
          path: .coverage-baseline
          key: granita-coverage-v2-${{ github.sha }}
          restore-keys: granita-coverage-v2-

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-input-unit
          path: build/coverage-inputs/unit
      - name: Download iOS shard 0 coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-input-ios-0
          path: build/coverage-inputs/ios-0
      - name: Download iOS shard 1 coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-input-ios-1
          path: build/coverage-inputs/ios-1
      - name: Download macOS coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-input-mac
          path: build/coverage-inputs/mac

      # The gate's arithmetic decides whether a pull request can merge, so it is verified by the job
      # that enforces it, before it is enforced. A virtualenv because Homebrew's Python on this
      # image is externally managed and refuses a plain `pip install`.
      - name: Test the coverage script
        run: make coverage-tests

      - name: Measure coverage
        run: bash .github/scripts/measure-coverage.sh

      # The per-file exports, so a row that falls can be diagnosed by reading which files moved
      # rather than by estimating. Uploaded whatever the gate decides, because the interesting case
      # is the run that failed and the runner's disk is gone by the time anyone asks.
      - name: Upload the coverage exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-exports
          path: |
            build/coverage/unit.json
            build/coverage/snapshot.json
            build/coverage/all.json
            build/coverage/summary.json
            build/coverage/*-diagnostics.log
          retention-days: 7
          if-no-files-found: warn

      # The same six numbers again, on their own and tiny. `coverage-exports` above is ~300 MB of
      # per-file detail, and `gh run download` cannot fetch one file out of an artifact — so a
      # developer wanting to know what the gate will say has to pull all of it. This is what
      # `make coverage` fetches instead: a few hundred bytes, kept long enough that a branch cut
      # weeks ago still has a baseline to measure against.
      - name: Upload the coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: build/coverage/summary.json
          retention-days: 90
          if-no-files-found: warn

      - name: Render the report
        run: |
          python3 .github/scripts/coverage.py render \
            --current build/coverage/summary.json \
            --baseline .coverage-baseline/summary.json \
            --out build/coverage/comment.md \
            --verdict-out build/coverage/verdict.json

      - name: Publish to the run summary
        run: cat build/coverage/comment.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, rewritten in place: it should show where coverage *is*, not a
      # transcript of every push. A fork gets a read-only token and cannot comment — the run summary
      # above still carries the report, so this is a soft failure.
      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('build/coverage/comment.md', 'utf8');
            const marker = '<!-- granita-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Store this run as the new baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .coverage-baseline
          cp build/coverage/summary.json .coverage-baseline/summary.json
      - name: Save the baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .coverage-baseline
          key: granita-coverage-v2-${{ github.sha }}

      # Last, so a blocked pull request already carries the comment explaining why. Pull requests
      # only: on a `main` push the merge has happened and the gate can prevent nothing, and turning
      # `main` red for a number no revert-free action can fix is a false alarm rather than a signal.
      # The baseline above is stored first for the same reason — `main` must keep tracking reality,
      # or every later pull request is measured against a number `main` no longer has.
      - name: Enforce the coverage gate
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/coverage.py enforce --verdict build/coverage/verdict.json

  # Isolated on purpose. The baselines are recorded locally and their rendering is
  # environment-sensitive, so keeping them in their own job means a pixel diff never masks a real
  # unit or build failure. This job GATES the pull request.
  snapshot-tests:
    name: Snapshot tests (iOS)
    needs: snapshot-tests-shards
    if: always()
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: Require every isolated shard and the TLS verdict
        env:
          RESULT: ${{ needs.snapshot-tests-shards.result }}
        run: test "$RESULT" = success

  snapshot-tests-shards:
    name: iOS snapshot shard (${{ matrix.shard }})
    needs: build-ios
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Download reusable iOS test products
        uses: actions/download-artifact@v4
        with:
          name: ios-test-products
          path: build
      - name: Restore compatible products without counters
        run: make coverage-ios-restore

      # Snapshot execution uses the transferred products. Only shard 0 needs package clones for
      # the separate required TLS integration pass; its counters stay outside measurement scope.
      #
      # Keyed on project.yml rather than on the project's Package.resolved, which is what Aura keys
      # on. Aura hand-maintains its .xcodeproj so that file is committed there; here the project is
      # generated, and the workspace lockfile is an ignored runtime cache — so hashFiles would
      # return empty on a fresh checkout, and every run would collide on one
      # degenerate key while looking like it had a cache.
      #
      # The cost of the substitute: project.yml pins a lower bound, so a new patch release of
      # snapshot-testing reuses a stale cache entry until this file changes. That only slows a run
      # down; it cannot make one wrong.
      - name: Cache SwiftPM source packages
        if: ${{ !inputs.cold && matrix.shard == 0 }}
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: snapshot-spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: snapshot-spm-${{ runner.os }}-
      - name: Resolve packages
        if: matrix.shard == 0
        run: xcodebuild -resolvePackageDependencies -project Granita.xcodeproj -scheme GranitaMobile -clonedSourcePackagesDirPath SourcePackages

      # Fail early and readably if the image has no simulator to render on, rather than surfacing it
      # as an opaque xcodebuild destination error.
      - name: Verify a simulator is available
        id: simulator
        run: |
          runtimes="$(xcrun simctl list runtimes available)"
          devices="$(xcrun simctl list devices available)"
          if ! grep -q 'iOS 27' <<< "$runtimes"; then
            echo "::error::No iOS 27 simulator runtime on this runner image"
            exit 1
          fi
          # The name is resolved rather than hardcoded: this image ships "iPhone 17 Pro" and not a
          # plain "iPhone 17", and that has already changed once between releases.
          # The first iPhone of the newest iOS runtime, the same expression as the Makefile's.
          name="$(awk '/^-- iOS /{name=""; inios=1; next} /^-- /{inios=0} inios && name=="" && match($0, /iPhone 1[6-9][A-Za-z ]*/){name=substr($0, RSTART, RLENGTH)} END{sub(/ +$/, "", name); print name}' <<< "$devices")"
          if [ -z "$name" ]; then
            echo "::error::No recent iPhone simulator on this runner image"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Using $name"

          # **Start the boot here so it overlaps the build below, rather than leaving it to
          # xcodebuild, which boots only once its build has finished and then simply waits.** On the
          # 1 September 2026 `main` run this job reported 946s for a suite whose test bodies account
          # for 5m30s, with a 9m31s gap between the app bundle being touched and the app's first log
          # line — and `simctl list` above took 74s on that runner, which is what a cold
          # CoreSimulator costs before anything has been asked of it.
          #
          # `boot` rather than `bootstatus -b`: this must not block the step, and a background child
          # would not reliably outlive it. `boot` returns as soon as CoreSimulator has taken the
          # request, and the daemon carries it on across the step boundary. It fails when the device
          # is already booted, which is a success for our purposes — hence the swallow. If the head
          # start does not happen for any other reason, xcodebuild still boots the device itself.
          xcrun simctl boot "$name" || true

      # See the macOS job below for why this one keeps "(iOS)" in its name.
      # Renders 24 baselines: six discovery states across iPhone and iPad, light and dark. The
      # assertions are main-actor isolated — without that, UIKit traps on a background thread, the
      # host restarts, and the retry reports "0 tests passed" having rendered nothing.
      - name: Run snapshot tests
        run: make coverage-ios-enumerate coverage-ios-plan coverage-ios-shard SHARD=${{ matrix.shard }}
      - name: Upload iOS coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-input-ios-${{ matrix.shard }}
          path: |
            build/coverage-inputs/ios-${{ matrix.shard }}/manifest.json
            build/coverage-inputs/ios-${{ matrix.shard }}/profile.profdata
            build/coverage-inputs/ios-${{ matrix.shard }}/objects
            build/coverage-inputs/ios-${{ matrix.shard }}/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload the iOS test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ matrix.shard }}
          path: build/coverage-inputs/ios-${{ matrix.shard }}/tests.xcresult
          retention-days: 7
          if-no-files-found: warn

      # Native TLS must be judged inside the app host, not by host-only certificate unit tests.
      - name: Run pinned TLS connection tests
        if: matrix.shard == 0
        run: make tls-tests-ios TLS_PACKAGE_FLAGS="-clonedSourcePackagesDirPath SourcePackages"

      # On a mismatch the freshly-rendered image is written beside the baseline it failed against
      # (SnapshotSupport pins SNAPSHOT_ARTIFACTS there). Pair them into one self-contained HTML page
      # so a red run is reviewable by eye — including on a phone — rather than by downloading an
      # .xcresult and opening Xcode.
      - name: Build the snapshot diff report
        if: failure()
        run: |
          python3 .github/scripts/snapshot-report.py \
            Apps/GranitaMobileSnapshotTests/__SnapshotFailures__ \
            Apps/GranitaMobileSnapshotTests/__Snapshots__ \
            snapshot-report
      - name: Upload the snapshot diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-${{ matrix.shard }}
          path: snapshot-report
          retention-days: 7
          if-no-files-found: warn

  # The Mac's half of the same kind, and a separate job rather than a second step in the one above.
  #
  # Two reasons, and the first is mechanical: renaming "Snapshot tests (iOS)" would leave every open
  # pull request waiting forever on a required check that no longer reports, because the ruleset
  # names checks by string. The second is the reason that job is isolated at all — a pixel diff on
  # one platform should not hide a real failure on the other, and these render on two different
  # things: the phone's baselines come off a simulator, the Mac's off the runner itself, because
  # there is no macOS simulator to render in.
  #
  # This job GATES the pull request, and needs adding to .github/rulesets/protect-main.json to do so.
  snapshot-tests-mac:
    name: Snapshot tests (macOS)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode

      # Same cache and same key as the iOS job: one package graph, one set of clones.
      - name: Cache SwiftPM source packages
        if: ${{ !inputs.cold }}
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: snapshot-spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: snapshot-spm-${{ runner.os }}-
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Granita.xcodeproj -scheme GranitaMac -clonedSourcePackagesDirPath SourcePackages

      # Renders the General tab in both appearances, and asserts the window's fixed size from inside
      # the app — which is the only place that can, since window geometry is not observable from
      # outside the process while Stage Manager is on.
      #
      # `-only-testing` because the GranitaMac scheme holds two kinds of test. Without it this job
      # would drive the app as well as photograph it, and a UI failure would arrive in the job least
      # able to explain it. The UI bundle is still *built* here, which is the only thing keeping it
      # compiling until a job of its own runs it.
      - name: Run snapshot tests
        run: make coverage-mac
      - name: Upload macOS coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-input-mac
          path: |
            build/coverage-inputs/mac/manifest.json
            build/coverage-inputs/mac/profile.profdata
            build/coverage-inputs/mac/objects
            build/coverage-inputs/mac/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload the macOS test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-results
          path: build/coverage-inputs/mac/tests.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Build the snapshot diff report
        if: failure()
        run: |
          python3 .github/scripts/snapshot-report.py \
            Apps/GranitaMacSnapshotTests/__SnapshotFailures__ \
            Apps/GranitaMacSnapshotTests/__Snapshots__ \
            snapshot-report-mac
      - name: Upload the snapshot diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-mac
          path: snapshot-report-mac
          retention-days: 7
          if-no-files-found: warn
