# Xcode project spec — regenerate Granita.xcodeproj with `make project` (XcodeGen).
#
# The generated project AND its shared schemes are committed, which is the one place this file
# departs from the spec's "gitignored build artifact". Xcode Cloud requires a project that is
# "continuously present" in the repository and reads its product list from shared schemes; a
# project generated at build time is explicitly unsupported. Committing it also retires the
# spec's Package.resolved trap, since nothing under the project is ignored any more.
#
# Never hand-edit project.pbxproj. This file is the source; `make project` is how it moves.

name: Granita

options:
  bundleIdPrefix: dev.fardavide.granita
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  # Keep the generated project byte-stable across runs, so regenerating never churns the diff.
  generateEmptyDirectories: false

packages:
  Granita:
    path: Packages/Granita
  # The fourth dependency, and the only one that is not in Package.swift. It is attached to the
  # app-hosted test target below and to nothing else, so the two shipped apps stay on three.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.4

# Settings both apps share. The version lives here, once, and it is bumped by hand — a second
# constant in CoreBrandingDomain tracks it, and a test fails until both agree. See
# .claude/skills/versioning.
settingGroups:
  shared:
    MARKETING_VERSION: 0.5.3
    # Placeholder only. The shipped build number is Xcode Cloud's own monotonic run number,
    # written into the project by ci_scripts/ci_pre_xcodebuild.sh — App Store Connect refuses a
    # build number that repeats within a release train, so a hardcoded 1 fails on the second
    # upload. See .claude/skills/versioning.
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: A7Q83J6LR4
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:

  GranitaMac:
    type: application
    platform: macOS
    sources:
      - Apps/GranitaMac
    dependencies:
      # The shell links exactly one product: the composition root. Nothing else is reachable
      # from the app bundle, which is what keeps the layer graph meaningful.
      - package: Granita
        product: ServerAppMain
    entitlements:
      path: Apps/GranitaMac/GranitaMac.entitlements
    info:
      path: Apps/GranitaMac/Info.plist
      properties:
        CFBundleDisplayName: Granita
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu bar only: no Dock icon, no main window.
        LSUIElement: true
        # Required for notarised distribution outside the Mac App Store (ITMS-90242 territory
        # for store builds, and it is what Finder shows as the app's category either way).
        LSApplicationCategoryType: public.app-category.developer-tools
        # Local network privacy applies to macOS 15+ too, and it covers *registering* a Bonjour
        # service, not only browsing — so the menu bar app shows an approval alert the first time
        # it advertises, and needs both keys to do so.
        NSLocalNetworkUsageDescription: >-
          Granita serves your diffs to your iPhone and iPad over your local network.
        NSBonjourServices:
          - _granita._tcp
        # Standard HTTPS only. Without this every upload sits in "Missing Compliance" and
        # reaches no tester until answered by hand, every single time.
        ITSAppUsesNonExemptEncryption: false
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fardavide.granita.mac
        PRODUCT_NAME: Granita
        # Notarisation requires the hardened runtime. Exec'ing /usr/bin/git is unaffected by it —
        # the binary is Apple-signed.
        ENABLE_HARDENED_RUNTIME: YES
        # macOS 15+ tracks program identity by code signature for local network privacy, so an
        # ad-hoc "Sign to Run Locally" identity makes the system lose the app across rebuilds and
        # Bonjour registration starts failing or re-prompting for no visible reason.
        CODE_SIGN_STYLE: Automatic

  GranitaMobile:
    type: application
    supportedDestinations: [iOS, iPadOS]
    sources:
      - Apps/GranitaMobile
    dependencies:
      - package: Granita
        product: ClientAppMain
    info:
      path: Apps/GranitaMobile/Info.plist
      properties:
        CFBundleDisplayName: Granita
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: >-
          Granita finds your Mac on your local network so you can read the diffs it serves.
        NSBonjourServices:
          - _granita._tcp
        # The one string in the pairing flow that has to earn a tap, and the only copy in it we
        # write for a system alert rather than for a screen: design §5 asks it to name what is read
        # and to say what is not kept, because the reader is being asked for a camera by an app that
        # has never wanted one before. The second sentence is the whole of what makes the first
        # answerable.
        NSCameraUsageDescription: >-
          Granita reads the pairing code your Mac displays. Nothing is photographed and nothing is
          stored.
        # What lets the outcome screen ask whether there is a TestFlight to send the reader to.
        # `canOpenURL` answers `false` for any scheme not listed here, whatever is installed — so
        # without this line the *phone is behind* state would never draw its one action, and the
        # decision recorded for it ("the button appears only when the system says it can open it")
        # would be a rule that always answers no.
        LSApplicationQueriesSchemes:
          - itms-beta
        # A custom trust evaluation in a URLSessionDelegate satisfies App Transport Security on
        # its own, so no exception is required. This key is kept as a declaration of intent, and
        # because it is what a plaintext fallback would need if TLS ever had to be turned off.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.fardavide.granita.pairing
            CFBundleURLSchemes: [granita]
        # iPad is a real target, not a scaled iPhone, so every iPad orientation is supported —
        # that is what makes the app resizable for Split View, Slide Over and Stage Manager.
        # `UIRequiresFullScreen` is deliberately absent: it is deprecated as of iOS 26 and will be
        # ignored, so declaring it only produces a build warning.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      groups: [shared]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fardavide.granita.mobile
        PRODUCT_NAME: Granita
        CODE_SIGN_STYLE: Automatic
        # 1,2 = iPhone and iPad. With iPhone alone iPadOS runs the app in compatibility mode: a
        # fixed iPhone-shaped window that cannot be resized, with no multitasking.
        TARGETED_DEVICE_FAMILY: "1,2"

  # The Mac's snapshot kind. Until this target existed the Settings window was measured by nothing
  # at all — the snapshot suite was the iOS target, so every macOS view was code no test rendered.
  #
  # App-hosted like its iOS sibling, and for the coverage reason rather than the rendering one:
  # macOS needs no `drawHierarchyInKeyWindow`, but a host is what makes the composition root's lines
  # execute where the profile is written, which is what keeps the Snapshot row measuring screen
  # composition rather than only leaf views.
  #
  # The host really launches, so the real server starts with it: it binds, it reaches for the TLS
  # identity in the login Keychain, and it tries to advertise over Bonjour. On a runner none of that
  # succeeds — an unsigned build cannot register a Bonjour service at all — and none of it needs to.
  # Every one of those failures is a `ServerRunState.failed` the app already handles, and no baseline
  # here renders the app's own scene: each test hosts the pane it is asserting in a window it makes
  # itself.
  GranitaMacSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/GranitaMacSnapshotTests
        # The baselines are the assertion, not a resource — see the iOS target below for what
        # flattening them into the bundle collides with.
        excludes:
          - "__Snapshots__/**"
          - "__SnapshotFailures__/**"
    dependencies:
      - target: GranitaMac
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        # Same override and same reason as the iOS bundle: PRODUCT_NAME renames the product to
        # `Granita`, so XcodeGen's target-derived default points at a bundle that is never built.
        # BUNDLE_EXECUTABLE_FOLDER_PATH is `Contents/MacOS` on macOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Granita.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Granita"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: dev.fardavide.granita.mac.snapshottests
        # Needed the moment anything in this scheme is signed, which the UI test bundle below is.
        # Without it the build fails with "Cannot code sign because the target does not have an
        # Info.plist file" — for *this* target, while the one being run is the other one.
        GENERATE_INFOPLIST_FILE: YES

  # The kind this project has owed since a dead control shipped for eight releases: a test that
  # drives the real app and asserts what changed, rather than photographing what it looks like.
  #
  # **No TEST_HOST and no BUNDLE_LOADER, and their absence is deliberate.** A UI test bundle is not
  # loaded into the app — it is a separate runner that launches it — so XcodeGen derives
  # `TEST_TARGET_NAME` from the target dependency below and derives `TEST_HOST` only for unit test
  # bundles. `TEST_TARGET_NAME` takes the *target* name rather than the product name, so the
  # `PRODUCT_NAME: Granita` rename that forces the override above cannot bite here. Adding a
  # TEST_HOST to "match" the bundle above is the wrong repair for any failure this target has.
  GranitaMacUiTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Apps/GranitaMacUiTests
    dependencies:
      - target: GranitaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fardavide.granita.mac.uitests
        # A runner app is signed — see the Makefile target — and signing wants a plist. Generated
        # rather than a file on disk: there is nothing in it anybody would ever edit.
        GENERATE_INFOPLIST_FILE: YES


  # Snapshot tests live here rather than in the package, and they have to. A SwiftPM test target is
  # hostless: there is no key window, so a SwiftUI view lays out against nothing and renders blank.
  # Only an app-hosted bundle gives the real window that `drawHierarchyInKeyWindow` needs.
  #
  # Named for the kind of test it holds, not for the app it hosts. The Coverage job reports a row per
  # kind and scopes each pass with `-only-testing:<target>`, so a bundle is the unit a kind is
  # measured in — a plain `GranitaMobileTests` would be the obvious place to drop a behavioural test,
  # and the snapshot row would then quietly start counting what a different kind of test reached.
  # Behavioural tests get `Apps/GranitaMobileUiTests` and a target beside this one.
  GranitaMobileSnapshotTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Apps/GranitaMobileSnapshotTests
        # The baselines are the assertion, not a resource. A file-system-synchronized group would
        # flatten every PNG into the bundle, where identically-named baselines from different suites
        # collide as "Multiple commands produce".
        excludes:
          - "__Snapshots__/**"
          - "__SnapshotFailures__/**"
    dependencies:
      - target: GranitaMobile
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        # Overridden deliberately. XcodeGen derives TEST_HOST from the TARGET name — giving
        # `GranitaMobile.app/GranitaMobile` — but PRODUCT_NAME renames the product to `Granita`, so
        # the generated default points at a bundle that is never built. It fails at build time with
        # a missing-input error naming Info.plist, which points nowhere near the cause.
        # BUNDLE_EXECUTABLE_FOLDER_PATH is empty on iOS and `Contents/MacOS` on macOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Granita.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Granita"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: dev.fardavide.granita.mobile.snapshottests

# XcodeGen emits a shared scheme only when a `schemes:` block declares one. Without this, Xcode
# Cloud's product list comes up empty with no explanation — verify with
# `xcodebuild -project Granita.xcodeproj -describeAllArchivableProducts -json`.
schemes:

  # Two kinds of test in one scheme, which is why every invocation of it now says `-only-testing`.
  # Without that, `make snapshots-mac` and the `Snapshot tests (macOS)` job would silently start
  # driving the app as well as photographing it — a kind widening another kind, and a red run in the
  # job least able to explain it.
  GranitaMac:
    build:
      targets:
        GranitaMac: all
        GranitaMacSnapshotTests: [test]
        GranitaMacUiTests: [test]
    test:
      config: Debug
      targets:
        - GranitaMacSnapshotTests
        - GranitaMacUiTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  GranitaMobile:
    build:
      targets:
        GranitaMobile: all
        GranitaMobileSnapshotTests: [test]
    test:
      config: Debug
      targets:
        - GranitaMobileSnapshotTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
